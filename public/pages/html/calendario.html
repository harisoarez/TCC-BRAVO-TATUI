<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário de Aulas - Instituto Bravo</title>
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/calendario.css">
</head>

<body>
    <!-- Cabeçalho Instagram -->
    <div class="header">
        <img src="../images/Instagram_icon.png" alt="Instagram" width="18" height="18" style="margin-right: 6px;">
        <a href="https://www.instagram.com/bravo_tatui/" target="_blank">@bravo_tatui</a>
    </div>

    <!-- Barra de Navegação Central (Gerenciada pelo navbar.js) -->
    <div id="nav-bar"></div>

    <!-- Dashboard -->
    <div class="dashboard-container">
        <!-- Calendário Principal -->
        <main class="calendar-main">
            <div id="bannerModo" class="aviso-modo-leitura oculto"></div>

            <!-- Topbar Mobile (Mês Completo, Ações de Busca, Hoje e Botão Adicionar Aula) -->
            <header class="calendario-mob-topbar">
                <div class="mob-mes-seletor">
                    <button type="button" id="btnMobPrev" class="btn-mob-nav" title="Mês Anterior">&lsaquo;</button>
                    <h2 id="mesMobTitulo" class="mes-mob-titulo">Outubro 2026</h2>
                    <button type="button" id="btnMobNext" class="btn-mob-nav" title="Próximo Mês">&rsaquo;</button>
                </div>

                <div class="mob-acoes-direita">
                    <button type="button" id="btnMobBusca" class="btn-mob-acao" title="Buscar / Filtrar Aulas">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <button type="button" id="btnMobHoje" class="btn-mob-hoje" title="Ir para o Dia de Hoje">
                        <span id="iconeDiaHoje">9</span>
                    </button>
                    <button type="button" id="btnNovaAulaMobile" class="btn-agendar-aula-mob" title="Agendar Nova Aula">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Adicionar Aula</span>
                    </button>
                </div>
            </header>

            <!-- Barra de Busca Rápida Mobile -->
            <div id="barraBuscaMobile" class="barra-busca-mob oculto">
                <input type="text" id="inputBuscaMob" placeholder="Buscar por título, instrumento ou professor...">
                <button type="button" id="btnLimparBuscaMob" class="btn-limpar-busca">&times;</button>
            </div>

            <!-- Header Original Desktop -->
            <header class="calendar-header">
                <div class="mes-nav">
                    <button id="btnAnterior">&lsaquo;</button>
                    <h2 id="mesAtual">Setembro 2026</h2>
                    <button id="btnProximo">&rsaquo;</button>
                </div>
                <button id="btnNovaAula" class="btn-admin oculto">+ Agendar aula</button>
            </header>

            <div class="calendar-grid">
                <div class="weekdays">
                    <span class="col-dom"><span class="txt-desk">Dom</span><span class="txt-mob">D</span></span>
                    <span class="col-seg"><span class="txt-desk">Seg</span><span class="txt-mob">S</span></span>
                    <span class="col-ter"><span class="txt-desk">Ter</span><span class="txt-mob">T</span></span>
                    <span class="col-qua"><span class="txt-desk">Qua</span><span class="txt-mob">Q</span></span>
                    <span class="col-qui"><span class="txt-desk">Qui</span><span class="txt-mob">Q</span></span>
                    <span class="col-sex"><span class="txt-desk">Sex</span><span class="txt-mob">S</span></span>
                    <span class="col-sab"><span class="txt-desk">Sáb</span><span class="txt-mob">S</span></span>
                </div>
                <div id="gradeAtual" class="days-grid"></div>
            </div>
        </main>

        <!-- Agenda do Dia -->
        <aside class="sidebar-details">
            <div class="todays-events">
                <!-- Cabeçalho Desktop -->
                <h3 class="desk-agenda-title">Aulas do Dia</h3>
                <p id="textoDataSelecionada" class="desk-agenda-sub">Selecione um dia no calendário</p>

                <!-- Cabeçalho Mobile no Modelo do Usuário (Ex: "9 SEX.") -->
                <div class="mob-selected-day-header">
                    <span id="mobDiaNumero" class="mob-dia-num">9</span>
                    <span id="mobDiaSemana" class="mob-dia-sem">SEX.</span>
                </div>

                <div id="agendaDia" class="events-list"></div>
            </div>

            <!-- Botão de Ação Mobile no Rodapé (Ex: "Adic. em 9 de out. +") -->
            <div class="mob-bottom-bar" id="mobBottomBar">
                <button type="button" id="btnMobAdicionarAula" class="btn-mob-adicionar">
                    <span id="textoBtnMobAdicionar">Adic. em 9 de out.</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>

            <div class="event-types">
                <h3>Legenda</h3>
                <ul>
                    <li><span class="dot normal"></span> Normal</li>
                    <li><span class="dot reposicao"></span> Reposição</li>
                    <li><span class="dot cancelada"></span> Cancelada</li>
                </ul>
            </div>
        </aside>
    </div>

    <!-- Modal 1: Resumo da Aula (Visão de Leitura) -->
    <div id="modalResumo" class="modal-overlay oculto">
        <div class="modal">
            <div class="modal-header">
                <div class="header-com-acoes">
                    <h2>Detalhes da Aula</h2>
                    <!-- Ícone de Lápis será injetado aqui via JS se for Admin -->
                    <div id="acoesResumo"></div>
                </div>
                <button class="btn-fechar" onclick="fecharModal('modalResumo')">&times;</button>
            </div>
            <div class="modal-content" id="detalhesAulaConteudo"></div>
        </div>
    </div>

    <!-- Modal 2: Formulário Agendar / Editar Aula -->
    <div id="modalFormulario" class="modal-overlay oculto">
        <div class="modal">
            <div class="modal-header">
                <div class="header-com-acoes">
                    <h2 id="tituloModalForm">Agendar Aula</h2>
                    <button id="btnLixeira" class="btn-icon oculto" title="Excluir Agendamento">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path
                                d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                </div>
                <button class="btn-fechar" onclick="fecharModal('modalFormulario')">&times;</button>
            </div>

            <form id="formAula" class="form-grid">
                <input type="hidden" id="aulaId">
                <div class="campo campo-grande">
                    <label>Título da Aula</label>
                    <input type="text" id="formTitulo" placeholder="Ex: Aula de Iniciação" required>
                </div>
                <div class="campo">
                    <label>Professor</label>
                    <select id="formProfessor" required>
                        <option value="">Selecione o Professor</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Instrumento</label>
                    <input type="text" id="formInstrumento" required>
                </div>
                <div class="campo">
                    <label>Data</label>
                    <input type="date" id="formData" required>
                </div>
                <div class="campo">
                    <label>Hora</label>
                    <input type="time" id="formHora" required>
                </div>
                <div class="campo">
                    <label>Sala</label>
                    <input type="number" id="formSala" required>
                </div>
                <div class="campo">
                    <label>Tipo de Aula</label>
                    <select id="formTipo">
                        <option value="normal">Normal</option>
                        <option value="reposicao">Reposição</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>
                <div class="campo campo-grande">
                    <label>Observações</label>
                    <textarea id="formObs" rows="2"></textarea>
                </div>
                <div class="campo campo-grande modal-botoes">
                    <button type="button" class="btn-secundario"
                        onclick="fecharModal('modalFormulario')">Cancelar</button>
                    <button type="submit" class="btn-admin">Salvar Aula</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 3: Opções de Exclusão -->
    <div id="modalExcluir" class="modal-overlay oculto">
        <div class="modal" style="width: 350px;">
            <div class="modal-header">
                <h2>Excluir Aula</h2>
                <button class="btn-fechar" onclick="fecharModal('modalExcluir')">&times;</button>
            </div>
            <div class="modal-content">
                <p style="margin-bottom: 20px; font-size: 14px;">Como deseja processar a exclusão desta aula no
                    calendário?</p>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn-secundario" onclick="processarExclusao('cancelar')">Apenas marcar como
                        Cancelada</button>
                    <button class="btn-secundario" style="border-color: #111; font-weight: 600;"
                        onclick="processarExclusao('apagar')">Excluir Definitivamente</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../script/navbar.js"></script>
    <script src="../script/calendario.js"></script>
</body>

</html>
